name: Feature request
description: Suggest a project improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Do not include client information, secrets, credentials, or confidential material."
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What user need or problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Share only public, non-sensitive context.
    validations:
      required: false
